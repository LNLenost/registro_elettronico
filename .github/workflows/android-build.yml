name: Android build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.5.3'
          channel: stable
      - run: flutter pub get
      - name: Align legacy Kotlin plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for plugin, version in {
              'flutter_email_sender': '1.3.61',
              'workmanager': '1.5.10',
          }.items():
            matches = list(Path.home().glob(
                f'.pub-cache/hosted/*/{plugin}-*/android/build.gradle'))
            assert len(matches) == 1, matches
            path = matches[0]
            source = path.read_text()
            updated, count = re.subn(
                rf"(ext\.kotlin_version\s*=\s*['\"]){re.escape(version)}(['\"])",
                r'\g<1>1.6.0\2',
                source,
            )
            assert count == 1, path
            if plugin == 'workmanager':
              updated, count = re.subn(
                  r'(def work_version\s*=\s*["\'])2\.4\.0(["\'])',
                  r'\g<1>2.7.1\2',
                  updated,
              )
              assert count == 1, path
            path.write_text(updated)
          PY
      - run: flutter test test/noticeboard_filter_test.dart
      - run: flutter test test/absences_filter_test.dart
      - run: flutter test test/navigation_config_test.dart
      - run: flutter test test/home_config_test.dart
      - run: flutter test test/notification_diff_test.dart
      - run: flutter test test/local_notification_test.dart
      - run: flutter test test/notification_preferences_test.dart
      - run: flutter test test/theme_event_test.dart
      - run: flutter test test/myprof_api_test.dart
      - run: flutter test test/background_sync_test.dart
      - run: flutter test test/notice_read_status_test.dart
      - run: flutter test test/sostituzioni_docenti_api_test.dart
      - run: flutter test test/homework_parser_test.dart
      - run: flutter test test/homework_filters_test.dart
      - run: flutter test test/agenda_local_events_test.dart
      - run: flutter test test/timetable_entry_test.dart
      - name: Configure release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Install compatible Android NDK
        env:
          SKIP_JDK_VERSION_CHECK: true
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;20.1.5948944"
      - name: Use API 35 resource linker
        run: printf '\nandroid.aapt2FromMavenOverride=%s\n' "$ANDROID_HOME/build-tools/35.0.0/aapt2" >> android/gradle.properties
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - run: cd android && ./gradlew :wear:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: registro-elettronico-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/wear/outputs/apk/release/wear-release.apk
