name: Android build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.5.3'
          channel: stable
      - run: flutter pub get
      - name: Align flutter_email_sender Kotlin plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          matches = list(Path.home().glob('.pub-cache/hosted/*/flutter_email_sender-*/android/build.gradle'))
          assert len(matches) == 1, matches
          path = matches[0]
          source = path.read_text()
          updated, count = re.subn(
              r"(ext\.kotlin_version\s*=\s*['\"])1\.3\.61(['\"])",
              r'\g<1>1.6.0\2',
              source,
          )
          assert count == 1, path
          path.write_text(updated)
          PY
      - run: flutter test test/noticeboard_filter_test.dart
      - run: flutter test test/absences_filter_test.dart
      - run: flutter test test/navigation_config_test.dart
      - run: flutter test test/home_config_test.dart
      - run: flutter test test/notification_diff_test.dart
      - run: flutter test test/notification_preferences_test.dart
      - run: flutter test test/theme_event_test.dart
      - run: flutter test test/myprof_api_test.dart
      - name: Configure release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Install compatible Android NDK
        env:
          SKIP_JDK_VERSION_CHECK: true
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;20.1.5948944"
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: registro-elettronico-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
